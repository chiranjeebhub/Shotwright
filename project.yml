name: Shotwright
options:
  bundleIdPrefix: com.shotwright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shotwright:
    type: application
    platform: macOS
    sources:
      - path: Shotwright
    info:
      path: Shotwright/Resources/Info.plist
      properties:
        CFBundleName: Shotwright
        CFBundleDisplayName: Shotwright
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Chiranjeeb Jena"
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSScreenCaptureUsageDescription: Shotwright needs screen recording access to capture screenshots and record your screen. Captures stay on your Mac.
    entitlements:
      path: Shotwright/Resources/Shotwright.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shotwright.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${SHOTWRIGHT_TEAM_ID}
        ENABLE_HARDENED_RUNTIME: true

name: Shotwright
options:
  bundleIdPrefix: com.shotwright
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Shotwright:
    type: application
    platform: macOS
    sources:
      - path: Shotwright
    info:
      path: Shotwright/Resources/Info.plist
      properties:
        CFBundleName: Shotwright
        CFBundleDisplayName: Shotwright
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSScreenCaptureUsageDescription: Shotwright needs screen recording access to capture screenshots.
    entitlements:
      path: Shotwright/Resources/Shotwright.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shotwright.app
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
